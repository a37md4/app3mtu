            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = msg;
            if (type === 'error') {

                toastIcon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';

                toastIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
            }, 3000);
        }

        // --- Core Tab Switch Handler ---
        function switchTab(index) {
            activeTabIndex = index;
            const data = tabsData[index];

            // Header Content Updating
            document.getElementById('header-title').innerHTML = `${data.title}`;
            document.getElementById('header-subtitle').innerText = data.subtitle;
            document.getElementById('header-main-icon').className = `fa-solid ${data.icon} text-amber-400 text-lg`;
            document.getElementById('header-bg-icon').className = `fa-solid ${data.icon}`;

            // Refresh Quick Stats Summary
            updateStatsBar();

            // Nav Bar Visual State Update (7 Tabs)
            for (let i = 0; i < 7; i++) {
                const btn = document.getElementById(`tab-${i}`);
                if (!btn) continue;
                const iconBox = btn.querySelector('.tab-icon-box');
                const label = btn.querySelector('span');

                if (i === index) {
                    btn.className = "flex flex-col items-center flex-1 py-1 transition-all group scale-105";
                    iconBox.className = "tab-icon-box w-8 h-8 sm:w-9 sm:h-9 rounded-2xl bg-slate-900 text-amber-400 shadow-md flex items-center justify-center transition-all duration-300";
                    label.className = "text-[8px] sm:text-[9px] font-black mt-0.5 truncate w-full text-center text-slate-900";
                } else {
                    btn.className = "flex flex-col items-center flex-1 py-1 transition-all group opacity-70 hover:opacity-100";
                    iconBox.className = "tab-icon-box w-8 h-8 sm:w-9 sm:h-9 rounded-2xl bg-transparent text-slate-500 flex items-center justify-center transition-all duration-300 group-hover:bg-slate-100";
                    label.className = "text-[8px] sm:text-[9px] font-bold mt-0.5 truncate w-full text-center text-slate-500";
                }
            }

            renderContent();
        }

        function updateStatsBar() {
            document.getElementById('stat-total-students').innerText = appState.students.length;
            document.getElementById('stat-total-classes').innerText = appState.classes.length;
            document.getElementById('stat-total-subjects').innerText = appState.subjects.length;
            document.getElementById('school-header-title').innerText = appState.schoolInfo.name;
        }

        // --- Main Render Engine ---
        function renderContent() {
            const container = document.getElementById('app-content');
            const data = tabsData[activeTabIndex];

            if (data.isSettings) {
                renderSettingsTab(container);
            } else if (data.isSchedule) {
                renderScheduleTab(container);
            } else if (data.isAttendance) {
                renderAttendanceTab(container);
            } else if (data.isBehavior) {
                renderBehaviorTab(container);
            } else if (data.isGradesTab) {
                renderGradesTab(container);
            } else if (data.isReports) {
                renderReportsTab(container);
            } else {
                renderCardsTab(container, data.cards);
            }
        }

        // 1. Render Cards List Tab (Tab 1)
        function renderCardsTab(container, cards) {
            let html = `<div class="grid grid-cols-1 gap-3.5">`;
            cards.forEach(card => {
                html += `
                    <div onclick="triggerAction('${card.action}')" class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/80 hover:border-slate-300 hover:shadow-md transition-all cursor-pointer relative flex items-center justify-between group">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl ${card.colorBg} border flex items-center justify-center text-lg shadow-xs group-hover:scale-105 transition-transform">
                                <i class="fa-solid ${card.icon}"></i>
                            </div>
                            <div class="pr-1">
                                <h3 class="font-black text-slate-800 text-xs mb-0.5 group-hover:text-slate-900">${card.title}</h3>
                                <p class="text-slate-500 text-[10px] leading-relaxed font-medium line-clamp-1">${card.desc}</p>
                            </div>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-slate-50 text-slate-400 group-hover:bg-slate-900 group-hover:text-amber-400 flex items-center justify-center transition-all text-xs">
                            <i class="fa-solid fa-chevron-left"></i>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // 2. Settings Tab Rendering
        function renderSettingsTab(container) {

                        <h3 class="font-black text-sm text-white">${appState.schoolInfo.name}</h3>

                            </div>
                            <i class="fa-solid fa-chevron-left text-xs text-slate-300"></i>

        // 3. Behavior Tab (قائمة المتابعة والتعديل المضاف)
        function renderBehaviorTab(container) {
            let stageOptions = Array.from(new Set(appState.classes.map(c => c.name))).map(c => `<option value="${c}">${c}</option>`).join('');
            let secOptions = Array.from(new Set(appState.classes.map(c => c.section))).map(s => `<option value="${s}">شعبة ${s}</option>`).join('');
            let subjectOptions = appState.subjects.map(s => `<option value="${s.name}">${s.name}</option>`).join('');

            container.innerHTML = `
                <div class="space-y-3.5">
                    <div class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-2xl flex justify-between items-center">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-award text-amber-600 text-lg"></i>
                            <div>
                                <h4 class="font-extrabold text-xs text-slate-800">سجل النشاط والمتابعة الأكاديمية</h4>
                                <p class="text-[10px] text-slate-500">إضافة وتقييم علامات الطلبة (مميز، متوسط، سيء)</p>

                        </div>
                    </div>

                    <!-- Filter & Marking Controls -->

                            <div>

                            </div>

                                <label class="block text-[10px] font-bold text-slate-600 mb-1">الشعبة:</label>

                                    <option value="all">جميع الشعب</option>
                                    ${secOptions}
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-600 mb-1">المادة الدراسية:</label>

                                    ${subjectOptions}

                                <label class="block text-[10px] font-bold text-slate-600 mb-1">تاريخ المتابعة:</label>
                                <input id="beh-date-input" type="date" value="${new Date().toISOString().split('T')[0]}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold text-slate-700 outline-none">
                            </div>
                        </div>
                    </div>

                    <div id="behavior-students-list"></div>
                </div>
            `;

            loadBehaviorStudentsList();
        }

        function loadBehaviorStudentsList() {
            const stage = document.getElementById('beh-stage-select') ? document.getElementById('beh-stage-select').value : 'all';
            const sec = document.getElementById('beh-sec-select') ? document.getElementById('beh-sec-select').value : 'all';
            const container = document.getElementById('behavior-students-list');
            if (!container) return;

            let filtered = appState.students.filter(s => 
                (stage === 'all' || s.class === stage) && 
                (sec === 'all' || s.section === sec)
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-3xl p-5 text-center text-xs text-slate-400 font-bold border border-slate-200/80">لا يوجد طلبة مطبقين للفلاتر المحددة</div>`;
                return;
            }

            let html = filtered.map((st, i) => {
                let ratingCounts = { 'مميز': 0, 'متوسط': 0, 'سيء': 0 };
                if (st.ratings) {
                    st.ratings.forEach(r => {
                        if (ratingCounts[r.mark] !== undefined) ratingCounts[r.mark]++;
                    });
                }
                return `
                    <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200/80 mb-2">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2.5">
                                <span class="w-7 h-7 rounded-full bg-slate-100 text-slate-700 text-xs font-bold flex items-center justify-center">${i+1}</span>
                                <div>
                                    <h4 class="font-bold text-xs text-slate-800">${st.name}</h4>
                                    <p class="text-[10px] text-slate-400">${st.class} (${st.section})</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-1 text-[9px] font-black">
                                <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-1.5 py-0.5 rounded-lg">مميز: ${ratingCounts['مميز']}</span>
                                <span class="bg-amber-50 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded-lg">متوسط: ${ratingCounts['متوسط']}</span>
                                <span class="bg-rose-50 text-rose-700 border border-rose-200 px-1.5 py-0.5 rounded-lg">سيء: ${ratingCounts['سيء']}</span>
                            </div>
                        </div>
                        
                        <div class="flex gap-1.5 mt-2 pt-2 border-t border-slate-100">
                            <button onclick="addStudentRating(${st.id}, 'مميز')" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 py-1 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                                <i class="fa-solid fa-star"></i>
                                <span>إضافة مميز</span>
                            </button>
                            <button onclick="addStudentRating(${st.id}, 'متوسط')" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 py-1 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                                <i class="fa-solid fa-minus"></i>
                                <span>إضافة متوسط</span>
                            </button>
                            <button onclick="addStudentRating(${st.id}, 'سيء')" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 py-1 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                                <i class="fa-solid fa-thumbs-down"></i>
                                <span>إضافة سيء</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        function addStudentRating(studentId, mark) {
            let student = appState.students.find(s => s.id === studentId);
            if (!student) return;

            const dateVal = document.getElementById('beh-date-input') ? document.getElementById('beh-date-input').value : new Date().toISOString().split('T')[0];
            const subjectVal = document.getElementById('beh-subject-select') ? document.getElementById('beh-subject-select').value : appState.schoolInfo.subject;

            if (!student.ratings) student.ratings = [];

            student.ratings.push({
                date: dateVal,
                stage: student.class,
                section: student.section,
                subject: subjectVal,
                mark: mark
            });

            showToast(`تمت إضافة علامة (${mark}) للطالب ${student.name}`);
            loadBehaviorStudentsList();
        }

        // 4. Schedule Tab Rendering
        function renderScheduleTab(container) {
            let scheduleHtml = `
                <div class="flex bg-white p-1.5 rounded-2xl shadow-sm mb-3.5 border border-slate-200/80 text-xs font-bold gap-2">
                    <div class="flex-1 text-center py-2 bg-slate-900 text-amber-400 rounded-xl shadow-xs flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-calendar-week"></i>
                        <span>جدول المحاضرات</span>
                    </div>
                    <button onclick="triggerAction('add_schedule_item')" class="flex-1 text-center py-2 bg-amber-50 text-amber-800 hover:bg-amber-100 rounded-xl transition-colors font-bold flex items-center justify-center gap-1.5 border border-amber-200">
                        <i class="fa-solid fa-plus"></i>
                        <span>إضافة محاضرة</span>
                    </button>
                </div>
            `;

            const days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
            days.forEach(day => {
                const dayClasses = appState.schedule.filter(s => s.day === day);
                scheduleHtml += `
                    <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80 mb-3">
                        <div class="flex justify-between items-center mb-2.5 pb-2 border-b border-slate-100">
                            <div class="flex items-center gap-2">
                                <div class="w-7 h-7 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-calendar-day"></i>
                                </div>
                                <span class="font-extrabold text-slate-800 text-xs">يوم ${day}</span>
                            </div>
                            <span class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-bold border border-emerald-100">${dayClasses.length} محاضرات</span>
                        </div>
                `;

                if (dayClasses.length === 0) {
                    scheduleHtml += `<p class="text-[11px] text-slate-400 text-center py-2 font-medium">لا توجد محاضرات في هذا اليوم</p>`;
                } else {
                    dayClasses.forEach(item => {
                        scheduleHtml += `
                            <div class="bg-slate-50/80 rounded-2xl p-2.5 mb-2 border border-slate-100 flex justify-between items-center">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-8 h-8 rounded-xl bg-slate-900 text-amber-400 font-black flex items-center justify-center text-xs shadow-xs">${item.period}</div>
                                    <div>
                                        <h4 class="font-bold text-slate-900 text-xs">${item.subject} <span class="text-[11px] text-slate-500 font-medium">(${item.className})</span></h4>
                                        <div class="flex items-center gap-2.5 mt-0.5 text-[10px] text-slate-500">
                                            <span><i class="fa-regular fa-clock text-rose-500 ml-1"></i> ${item.time}</span>
                                            <span><i class="fa-solid fa-location-dot text-indigo-500 ml-1"></i> ${item.hall}</span>
                                        </div>
                                    </div>
                                </div>
                                <button onclick="deleteScheduleItem(${item.period}, '${day}')" class="w-7 h-7 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center hover:bg-rose-100 transition-colors">
                                    <i class="fa-solid fa-trash-can text-[10px]"></i>
                                </button>
                            </div>
                        `;
                    });
                }
                scheduleHtml += `</div>`;
            });

            container.innerHTML = scheduleHtml;
        }

            container.innerHTML = `
                <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/80 mb-3.5">
                    <h3 class="font-black text-slate-800 text-xs mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-filter text-amber-500"></i>
                        <span id="att-form-title">جلسة تسجيل الحضور والغياب اليومي</span>

                    <div class="space-y-2.5">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-extrabold text-slate-600 mb-1">المرحلة والشعبة:</label>
                                <select id="att-class-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold text-slate-700 outline-none focus:border-slate-900">

                                <label class="block text-[10px] font-extrabold text-slate-600 mb-1">تاريخ المحاضرة:</label>
                                <input id="att-date-input" type="date" value="${new Date().toISOString().split('T')[0]}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold text-slate-700 outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-extrabold text-slate-600 mb-1">المادة الدراسية:</label>
                            <select id="att-subject-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold text-slate-700 outline-none focus:border-slate-900">
                                ${subjectOptions || '<option>لا توجد مواد مضافة</option>'}
                            </select>
                        </div>
                        <button onclick="loadAttendanceList()" class="w-full bg-slate-900 text-amber-400 py-2.5 rounded-xl font-black text-xs shadow-md hover:bg-slate-800 transition-colors flex items-center justify-center gap-2">
                            <i class="fa-solid fa-list-check"></i>
                            <span>فتح السجل مرتب أبجديًا</span>
                        </button>
                    </div>
                </div>

                <div id="attendance-list-container"></div>

                <!-- Saved Sessions Section -->
                <div class="mt-4 bg-slate-100/80 rounded-3xl p-3.5 border border-slate-200">
                    <h4 class="font-extrabold text-xs text-slate-800 mb-2.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i>
                        <span>جلسات الحضور المحفوظة (إمكانية التعديل):</span>
                    </h4>
                    <div id="saved-sessions-list">${savedSessionsHtml || '<p class="text-[11px] text-slate-400 text-center py-2">لا توجد جلسات محفوظة حاليًا</p>'}</div>
                </div>
            `;
        }

        function loadAttendanceList(editingSession = null) {
            const classVal = document.getElementById('att-class-select').value;
            const subjectVal = document.getElementById('att-subject-select').value;
            const container = document.getElementById('attendance-list-container');

            if (!classVal) {
                showToast("الرجاء اختيار المرحلة أولاً", "error");
                return;
            }

            const [className, sectionPart] = classVal.split(" - ");
            const section = sectionPart || "أ";

            let filteredStudents = appState.students.filter(s => s.class.trim() === className.trim() && s.section.trim() === section.trim());
            filteredStudents.sort((a, b) => a.name.localeCompare(b.name, 'ar'));

            if (filteredStudents.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-5 text-center border border-slate-200/80">
                        <i class="fa-solid fa-users-slash text-slate-300 text-3xl mb-2"></i>
                        <p class="text-xs text-slate-500 font-bold">لا يوجد طلبة مسجلين في (${className} - شعبة ${section})</p>
                    </div>
                `;
                return;
            }

            // Initialize statuses
            currentAttendanceMap = {};
            filteredStudents.forEach(st => {
                if (editingSession && editingSession.records && editingSession.records[st.id]) {
                    currentAttendanceMap[st.id] = editingSession.records[st.id];
                } else {
                    currentAttendanceMap[st.id] = 'present'; // default
                }
            });

            renderAttendanceRows(filteredStudents, className, section, subjectVal, editingSession ? editingSession.id : null);
        }

        function renderAttendanceRows(students, className, section, subjectVal, sessionId = null) {
            const container = document.getElementById('attendance-list-container');
            let listHtml = `
                <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80">
                    <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                        <div>
                            <h4 class="font-black text-slate-800 text-xs">${sessionId ? 'تعديل جلسة حُفظت سابقًا' : 'سجل الحضور والغياب اليومي'}</h4>
                            <p class="text-[10px] text-slate-400">${className} (${section}) | ${subjectVal}</p>
                        </div>
                        <span class="text-[10px] bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full font-bold">${students.length} طالب</span>
                    </div>

                    <!-- Quick Action Buttons -->
                    <div class="flex gap-2 mb-3">
                        <button onclick="setAllAttendanceStatus('present')" class="flex-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 py-1.5 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                            <i class="fa-solid fa-check-double"></i>
                            <span>تحديد الكل حاضر</span>
                        </button>
                        <button onclick="setAllAttendanceStatus('absent')" class="flex-1 bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200 py-1.5 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                            <i class="fa-solid fa-xmark"></i>
                            <span>تحديد الكل غائب</span>
                        </button>
                    </div>

                    <div class="space-y-2">
            `;

            students.forEach((st, idx) => {
                let status = currentAttendanceMap[st.id] || 'present';
                listHtml += `
                    <div class="flex items-center justify-between bg-slate-50/80 p-2 rounded-2xl border border-slate-100">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-[10px] font-bold flex items-center justify-center">${idx + 1}</span>
                            <div>
                                <h5 class="font-bold text-slate-800 text-xs">${st.name}</h5>
                                <span class="text-[9px] text-slate-400">${st.phone || 'بدون هاتف'}</span>
                            </div>
                        </div>
                        <div class="flex gap-1" id="att-btns-${st.id}">
                            <button onclick="setSingleAttendanceStatus(${st.id}, 'present')" class="px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'present' ? 'bg-emerald-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}">حاضر</button>
                            <button onclick="setSingleAttendanceStatus(${st.id}, 'absent')" class="px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'absent' ? 'bg-rose-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}">غائب</button>
                            <button onclick="setSingleAttendanceStatus(${st.id}, 'excused')" class="px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'excused' ? 'bg-amber-500 text-slate-900 shadow-xs font-extrabold' : 'bg-slate-200 text-slate-600'}">مجاز</button>
                        </div>
                    </div>
                `;
            });

            listHtml += `
                    </div>
                    <button onclick="saveAttendanceRecord(${sessionId})" class="w-full mt-3.5 bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-md hover:bg-emerald-700 transition-colors flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>${sessionId ? 'تحديث وحفظ الجلسة المعدلة' : 'حفظ وتسجيل المحاضرة'}</span>
                    </button>
                </div>
            `;

            container.innerHTML = listHtml;
        }

        function setSingleAttendanceStatus(studentId, status) {
            currentAttendanceMap[studentId] = status;
            const btnBox = document.getElementById(`att-btns-${studentId}`);
            if (!btnBox) return;
            const buttons = btnBox.querySelectorAll('button');
            buttons[0].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'present' ? 'bg-emerald-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}`;
            buttons[1].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'absent' ? 'bg-rose-600 text-white shadow-xs' : 'bg-slate-200 text-slate-600'}`;
            buttons[2].className = `px-2 py-1 rounded-xl text-[10px] font-bold transition-all ${status === 'excused' ? 'bg-amber-500 text-slate-900 shadow-xs font-extrabold' : 'bg-slate-200 text-slate-600'}`;
        }

        function setAllAttendanceStatus(status) {
            Object.keys(currentAttendanceMap).forEach(stId => {
                setSingleAttendanceStatus(parseInt(stId), status);
            });
            showToast(status === 'present' ? "تم تحديد جميع الطلبة كـ حاضر" : "تم تحديد جميع الطلبة كـ غائب");
        }

        function saveAttendanceRecord(editingSessionId = null) {
            const classVal = document.getElementById('att-class-select').value;
            const subjectVal = document.getElementById('att-subject-select').value;
            const dateVal = document.getElementById('att-date-input').value;

            const [className, sectionPart] = classVal.split(" - ");
            const section = sectionPart || "أ";

            if (editingSessionId) {
                let sess = appState.savedSessions.find(s => s.id === editingSessionId);
                if (sess) {
                    sess.date = dateVal;
                    sess.className = className;
                    sess.section = section;
                    sess.subject = subjectVal;
                    sess.records = { ...currentAttendanceMap };
                }
                showToast("تم تحديث الجلسة المحفوظة بنجاح!");
            } else {
                let newSession = {
                    id: Date.now(),
                    date: dateVal,
                    className: className,
                    section: section,
                    subject: subjectVal,
                    records: { ...currentAttendanceMap }
                };
                appState.savedSessions.unshift(newSession);

                // Update student metrics
                Object.keys(currentAttendanceMap).forEach(stId => {
                    let st = appState.students.find(s => s.id === parseInt(stId));
                    if (st) {
                        let stStatus = currentAttendanceMap[stId];
                        if (stStatus === 'present') st.attendanceCount = (st.attendanceCount || 0) + 1;
                        else if (stStatus === 'absent') {
                            st.absenceCount = (st.absenceCount || 0) + 1;
                            if (!st.absenceLog) st.absenceLog = [];
                            st.absenceLog.push({ date: dateVal, day: "يوم المحاضرة", status: "غائب" });
                        } else if (stStatus === 'excused') {
                            st.excusedCount = (st.excusedCount || 0) + 1;
                            if (!st.absenceLog) st.absenceLog = [];
                            st.absenceLog.push({ date: dateVal, day: "يوم المحاضرة", status: "مجاز" });
                        }
                    }
                });
                showToast("تم تسجيل وحفظ جلسة الحضور بنجاح!");
            }

            renderContent();
        }

        function editSavedSession(sessId) {
            let sess = appState.savedSessions.find(s => s.id === sessId);
            if (!sess) return;

            document.getElementById('att-class-select').value = `${sess.className} - ${sess.section}`;
            document.getElementById('att-subject-select').value = sess.subject;
            document.getElementById('att-date-input').value = sess.date;

            loadAttendanceList(sess);
            showToast("جاري تحميل بيانات الجلسة للتعديل...");
        }

        // --- 6. GRADES TAB RENDERER ---
        function renderGradesTab(container) {

            let secOptions = Array.from(new Set(appState.classes.map(c => c.section))).map(s => `<option value="${s}">شعبة ${s}</option>`).join('');

            container.innerHTML = `
                <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80 mb-3.5">

                        <span>سجل وادارة الدرجات والنتائج الأكاديمية</span>
                    </h3>
                    <div class="grid grid-cols-2 gap-2 mb-3">

                                <option value="all">جميع الشعب</option>
                                ${secOptions}
                            </select>
                        </div>
                    </div>

                    <!-- Sub Tabs Bar (5 Sub Tabs) -->
                    <div class="flex bg-slate-200/80 p-1 rounded-2xl text-[9px] font-black text-slate-700 gap-1 overflow-x-auto no-scrollbar">
                        <button onclick="switchGradesSubTab(0)" id="grd-subtab-0" class="flex-1 py-1.5 px-2 rounded-xl transition-all whitespace-nowrap bg-slate-900 text-amber-400 shadow-xs">
                            الفصل الأول (25)
                        </button>
                        <button onclick="switchGradesSubTab(1)" id="grd-subtab-1" class="flex-1 py-1.5 px-2 rounded-xl transition-all whitespace-nowrap hover:bg-slate-300">
                            الفصل الثاني (25)
                        </button>
                        <button onclick="switchGradesSubTab(2)" id="grd-subtab-2" class="flex-1 py-1.5 px-2 rounded-xl transition-all whitespace-nowrap hover:bg-slate-300">
                            درجة السعي (50)
                        </button>
                        <button onclick="switchGradesSubTab(3)" id="grd-subtab-3" class="flex-1 py-1.5 px-2 rounded-xl transition-all whitespace-nowrap hover:bg-slate-300">
                            الفاينل (50)
                        </button>
                        <button onclick="switchGradesSubTab(4)" id="grd-subtab-4" class="flex-1 py-1.5 px-2 rounded-xl transition-all whitespace-nowrap hover:bg-slate-300">
                            النتيجة النهائية (100)
                        </button>
                    </div>
                </div>

                <div id="grades-subtab-content"></div>
            `;

            renderGradesContent();
        }

        function switchGradesSubTab(subIndex) {
            activeGradesSubTab = subIndex;
            for (let i = 0; i < 5; i++) {
                const btn = document.getElementById(`grd-subtab-${i}`);
                if (!btn) continue;
                if (i === subIndex) {
                    btn.className = "flex-1 py-1.5 px-2 rounded-xl transition-all whitespace-nowrap bg-slate-900 text-amber-400 font-black shadow-xs";
                } else {
                    btn.className = "flex-1 py-1.5 px-2 rounded-xl transition-all whitespace-nowrap hover:bg-slate-300 text-slate-700 font-bold";
                }
            }
            renderGradesContent();
        }

        function renderGradesContent() {
            const stage = document.getElementById('grd-stage-select') ? document.getElementById('grd-stage-select').value : 'all';
            const sec = document.getElementById('grd-sec-select') ? document.getElementById('grd-sec-select').value : 'all';
            const container = document.getElementById('grades-subtab-content');
            if (!container) return;

            let filtered = appState.students.filter(s => 
                (stage === 'all' || s.class === stage) && 
                (sec === 'all' || s.section === sec)
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-3xl p-5 text-center text-xs text-slate-400 font-bold">لا يوجد طلبة مطبقين للفلاتر المحددة</div>`;
                return;
            }

            let html = '';

            // SubTab 0: درجة الفصل الأول (25 = 20 امتحان + 5 تقييم)
            if (activeGradesSubTab === 0) {
                let rows = filtered.map((s, idx) => {
                    let t1Exam = s.t1Exam || 0;
                    let t1Eval = s.t1Eval || 0;
                    let sum = t1Exam + t1Eval;
                    return `
                        <tr class="border-b border-slate-100 text-[11px]">
                            <td class="p-2 font-bold text-center">${idx+1}</td>
                            <td class="p-2 font-bold text-slate-800">${s.name}</td>
                            <td class="p-2 text-center">
                                <input type="number" min="0" max="20" id="inp-t1exam-${s.id}" value="${t1Exam}" onchange="recalcTerm1Sum(${s.id})" class="w-12 bg-slate-50 border p-1 rounded-lg text-center font-bold text-slate-900 outline-none">
                            </td>
                            <td class="p-2 text-center">

                            </td>
                            <td class="p-2 text-center font-black text-indigo-700" id="sum-t1-${s.id}">${sum} / 25</td>

                }).join('');

                html = `
                    <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80">
                        <div class="bg-indigo-50 border border-indigo-200 p-2.5 rounded-2xl mb-3 flex items-center justify-between text-indigo-900">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-circle-info text-indigo-600"></i>
                                <p class="text-[10px] font-bold">درجة الفصل الأول: (20 للـامتحان + 5 للـتقييم = 25 درجة)</p>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-right">
                                <thead class="bg-slate-900 text-amber-400 text-[10px]">
                                    <tr><th class="p-2 text-center">#</th><th class="p-2">اسم الطالب</th><th class="p-2 text-center">امتحان (20)</th><th class="p-2 text-center">تقييم (5)</th><th class="p-2 text-center">المجموع (25)</th></tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                        <button onclick="saveTerm1Grades()" class="w-full mt-3 bg-slate-900 text-amber-400 py-2.5 rounded-xl font-black text-xs shadow-md hover:bg-slate-800 transition-colors flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>حفظ درجات الفصل الأول</span>
                        </button>
                    </div>
                `;
            }

            // SubTab 1: درجة الفصل الثاني (25 = 20 امتحان + 5 تقييم)
            else if (activeGradesSubTab === 1) {
                let rows = filtered.map((s, idx) => {
                    let t2Exam = s.t2Exam || 0;
                    let t2Eval = s.t2Eval || 0;
                    let sum = t2Exam + t2Eval;
                    return `
                        <tr class="border-b border-slate-100 text-[11px]">
                            <td class="p-2 font-bold text-center">${idx+1}</td>
                            <td class="p-2 font-bold text-slate-800">${s.name}</td>

                                <input type="number" min="0" max="20" id="inp-t2exam-${s.id}" value="${t2Exam}" onchange="recalcTerm2Sum(${s.id})" class="w-12 bg-slate-50 border p-1 rounded-lg text-center font-bold text-slate-900 outline-none">

                            </td>
                            <td class="p-2 text-center font-black text-sky-700" id="sum-t2-${s.id}">${sum} / 25</td>
                        </tr>
                    `;
                }).join('');

                html = `
                    <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80">
                        <div class="bg-sky-50 border border-sky-200 p-2.5 rounded-2xl mb-3 flex items-center justify-between text-sky-900">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-circle-info text-sky-600"></i>
                                <p class="text-[10px] font-bold">درجة الفصل الثاني: (20 للـامتحان + 5 للـتقييم = 25 درجة)</p>

                            <table class="w-full text-right">
                                <thead class="bg-slate-900 text-amber-400 text-[10px]">

                                </thead>
                                <tbody>${rows}</tbody>

            else if (activeGradesSubTab === 3) {

                    let saai = (s.t1Exam||0) + (s.t1Eval||0) + (s.t2Exam||0) + (s.t2Eval||0);
                    let final = s.final || 0;

            let sumEl = document.getElementById(`sum-t1-${studentId}`);
            if (sumEl) sumEl.innerText = `${exam + evalVal} / 25`;
        }

        function recalcTerm2Sum(studentId) {
            let exam = parseFloat(document.getElementById(`inp-t2exam-${studentId}`).value) || 0;
            let evalVal = parseFloat(document.getElementById(`inp-t2eval-${studentId}`).value) || 0;
            let sumEl = document.getElementById(`sum-t2-${studentId}`);
            if (sumEl) sumEl.innerText = `${exam + evalVal} / 25`;
        }

        function saveTerm1Grades() {
            appState.students.forEach(s => {

                if (inpEval) s.t2Eval = parseFloat(inpEval.value) || 0;

                        <div>
                            <label class="block text-[9px] font-bold text-slate-600 mb-1">الشعبة:</label>
                            <select id="rep-att-date-sec" onchange="updateAttByDateReport()" class="w-full bg-slate-50 border p-1.5 rounded-xl text-[11px] font-bold">
                                <option value="all">الكل</option>
                                ${secOptions}
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right">
                            <thead class="bg-slate-900 text-amber-400 text-[10px]">
                                <tr><th class="p-2 text-center">#</th><th class="p-2">اسم الطالب</th><th class="p-2 text-center">المرحلة</th><th class="p-2 text-center">حالة الحضور</th></tr>
                            </thead>
                            <tbody id="att-date-report-body"></tbody>
                        </table>
                    </div>
                `;
                updateAttByDateReport();
            } else if (reportKey === 'att_by_student') {
                titleEl.innerText = "تقرير حضور طالب مفصل";
                iconEl.className = "fa-solid fa-user-tag";
                bodyEl.innerHTML = headerHTML + `
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">اختر المرحلة:</label>
                            <select id="rep-att-st-stage" onchange="updateAttStudentDropdown()" class="w-full bg-slate-50 border p-1.5 rounded-xl text-xs font-bold">
                                <option value="all">جميع المراحل</option>
                                ${stageOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">اختر الشعبة:</label>
                            <select id="rep-att-st-sec" onchange="updateAttStudentDropdown()" class="w-full bg-slate-50 border p-1.5 rounded-xl text-xs font-bold">
                                <option value="all">جميع الشعب</option>
                                ${secOptions}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="block text-[10px] font-bold text-slate-600 mb-1">اختر الطالب:</label>
                        <select id="rep-att-st-id" onchange="renderSelectedStudentAttReport()" class="w-full bg-slate-50 border p-2 rounded-xl text-xs font-bold text-slate-800">
                        </select>
                    </div>
                    <div id="rep-att-st-details"></div>
                `;
                updateAttStudentDropdown();
            } else if (reportKey === 'att_exceeded') {
                titleEl.innerText = "تقرير الطلبة المتجاوزين لنسبة الغياب (10%)";
                iconEl.className = "fa-solid fa-ban";
                bodyEl.innerHTML = headerHTML + `
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">المرحلة:</label>
                            <select id="rep-exc-stage" onchange="updateAttExceededReport()" class="w-full bg-slate-50 border p-2 rounded-xl text-xs font-bold">
                                <option value="all">جميع المراحل</option>
                                ${stageOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">الشعبة:</label>
                            <select id="rep-exc-sec" onchange="updateAttExceededReport()" class="w-full bg-slate-50 border p-2 rounded-xl text-xs font-bold">
                                <option value="all">جميع الشعب</option>
                                ${secOptions}
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right">
                            <thead class="bg-rose-950 text-rose-200 text-[10px]">
                                <tr><th class="p-2 text-center">#</th><th class="p-2">اسم الطالب</th><th class="p-2 text-center">المرحلة والشعبة</th><th class="p-2 text-center">عدد الغيابات</th><th class="p-2 text-center">نسبة الغياب</th></tr>
                            </thead>
                            <tbody id="att-exc-report-body"></tbody>
                        </table>
                    </div>
                `;
                updateAttExceededReport();
            }

            // 3. تقارير الدرجات
            else if (reportKey === 'grades_by_section') {
                titleEl.innerText = "كشف درجات وسعي الشعبة";
                iconEl.className = "fa-solid fa-file-invoice";
                bodyEl.innerHTML = headerHTML + `
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">المرحلة:</label>
                            <select id="rep-grd-stage" onchange="updateGradesSectionReport()" class="w-full bg-slate-50 border p-2 rounded-xl text-xs font-bold">
                                <option value="all">جميع المراحل</option>
                                ${stageOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">الشعبة:</label>
                            <select id="rep-grd-sec" onchange="updateGradesSectionReport()" class="w-full bg-slate-50 border p-2 rounded-xl text-xs font-bold">
                                <option value="all">جميع الشعب</option>
                                ${secOptions}
                            </select>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right">
                            <thead class="bg-slate-900 text-amber-400 text-[9px]">
                                <tr><th class="p-1.5 text-center">#</th><th class="p-1.5">الاسم</th><th class="p-1.5 text-center">السعي (50)</th><th class="p-1.5 text-center">الفاينل (50)</th><th class="p-1.5 text-center">المجموع</th><th class="p-1.5 text-center">النتيجة</th></tr>
                            </thead>
                            <tbody id="grades-sec-report-body"></tbody>
                        </table>
                    </div>
                `;
                updateGradesSectionReport();
            } else if (reportKey === 'grades_passed') {
                titleEl.innerText = "تقرير الطلبة الناجحين";
                iconEl.className = "fa-solid fa-circle-check";
                let passed = appState.students.filter(s => ((s.t1Exam||0)+(s.t1Eval||0)+(s.t2Exam||0)+(s.t2Eval||0)+(s.final||0)) >= 50);
                let rows = passed.map(s => {
                    let total = (s.t1Exam||0)+(s.t1Eval||0)+(s.t2Exam||0)+(s.t2Eval||0)+(s.final||0);
                    return `<div class="p-2 bg-emerald-50 border border-emerald-200 rounded-xl mb-1 text-xs font-bold flex justify-between"><span>${s.name} (${s.class})</span><span class="text-emerald-700 font-black">${total} (ناجح)</span></div>`;
                }).join('');
                bodyEl.innerHTML = headerHTML + `<div class="space-y-1">${rows || '<p class="text-xs text-slate-400 text-center">لا يوجد طلبة ناجحون</p>'}</div>`;
            } else {
                bodyEl.innerHTML = headerHTML + `<p class="text-center text-xs font-bold text-slate-500 py-4">جاري تجهيز بيانات هذا التقرير...</p>`;
            }
        }

        // --- Report Dynamic Helpers ---
        function updateAllStudentsReport() {
            const stg = document.getElementById('rep-filter-stage').value;
            const sec = document.getElementById('rep-filter-section').value;
            const tbody = document.getElementById('all-students-report-body');

            let filtered = appState.students.filter(s => 
                (stg === 'all' || s.class === stg) && (sec === 'all' || s.section === sec)
            );

            tbody.innerHTML = filtered.map((s, i) => `
                <tr class="border-b border-slate-100 text-[11px]">
                    <td class="p-2 text-center font-bold">${i+1}</td>
                    <td class="p-2 font-bold text-slate-800">${s.name}</td>
                    <td class="p-2 text-center">${s.class}</td>
                    <td class="p-2 text-center">${s.section}</td>
                    <td class="p-2 text-center text-slate-500">${s.phone}</td>
                </tr>
            `).join('') || `<tr><td colspan="5" class="p-3 text-center text-slate-400">لا توجد سجلات مطابقة</td></tr>`;
        }

        function updateStudentsBySectionReport() {
            const stg = document.getElementById('rep-sec-filter-stage').value;
            const sec = document.getElementById('rep-sec-filter-section').value;
            const tbody = document.getElementById('sec-students-report-body');

            let filtered = appState.students.filter(s => 
                (stg === 'all' || s.class === stg) && (sec === 'all' || s.section === sec)
            );

            tbody.innerHTML = filtered.map((s, i) => `
                <tr class="border-b border-slate-100 text-[11px]">
                    <td class="p-2 text-center font-bold">${i+1}</td>
                    <td class="p-2 font-bold text-slate-800">${s.name}</td>
                    <td class="p-2 text-center font-semibold text-indigo-700">${s.class} (${s.section})</td>
                    <td class="p-2 text-center text-slate-500">${s.phone}</td>
                </tr>
            `).join('') || `<tr><td colspan="4" class="p-3 text-center text-slate-400">لا توجد سجلات مطابقة</td></tr>`;
        }

        function updateFollowupReport() {
            const stg = document.getElementById('rep-fol-stage') ? document.getElementById('rep-fol-stage').value : 'all';
            const sec = document.getElementById('rep-fol-sec') ? document.getElementById('rep-fol-sec').value : 'all';
            const tbody = document.getElementById('followup-report-body');
            if (!tbody) return;

            let filtered = appState.students.filter(s => 
                (stg === 'all' || s.class === stg) && (sec === 'all' || s.section === sec)
            );

            tbody.innerHTML = filtered.map((s, i) => {
                let ratingCounts = { 'مميز': 0, 'متوسط': 0, 'سيء': 0 };
                if (s.ratings) {
                    s.ratings.forEach(r => {
                        if (ratingCounts[r.mark] !== undefined) ratingCounts[r.mark]++;
                    });
                }
                let totalMarks = ratingCounts['مميز'] + ratingCounts['متوسط'] + ratingCounts['سيء'];
                return `
                    <tr class="border-b border-slate-100 text-[11px]">
                        <td class="p-2 text-center font-bold">${i+1}</td>
                        <td class="p-2 font-bold text-slate-800">${s.name}</td>
                        <td class="p-2 text-center text-slate-600">${s.class} (${s.section})</td>
                        <td class="p-2 text-center font-black text-emerald-600 bg-emerald-50/50">${ratingCounts['مميز']}</td>
                        <td class="p-2 text-center font-black text-amber-600 bg-amber-50/50">${ratingCounts['متوسط']}</td>
                        <td class="p-2 text-center font-black text-rose-600 bg-rose-50/50">${ratingCounts['سيء']}</td>
                        <td class="p-2 text-center font-black text-slate-900">${totalMarks}</td>
                    </tr>
                `;
            }).join('') || `<tr><td colspan="7" class="p-3 text-center text-slate-400">لا توجد بيانات متابعة مطابقة</td></tr>`;
        }

        function updateAttByDateReport() {
            const dateVal = document.getElementById('rep-att-date-picker').value;
            const stg = document.getElementById('rep-att-date-stage').value;
            const sec = document.getElementById('rep-att-date-sec').value;
            const tbody = document.getElementById('att-date-report-body');

            let filtered = appState.students.filter(s => 
                (stg === 'all' || s.class === stg) && (sec === 'all' || s.section === sec)
            );

            let session = appState.savedSessions.find(s => s.date === dateVal);

            tbody.innerHTML = filtered.map((s, i) => {
                let statusText = "غير مسجل";
                let statusClass = "bg-slate-100 text-slate-600";

                if (session && session.records && session.records[s.id]) {
                    let st = session.records[s.id];
                    if (st === 'present') { statusText = "حاضر ✓"; statusClass = "bg-emerald-100 text-emerald-800"; }
                    else if (st === 'absent') { statusText = "غائب ✗"; statusClass = "bg-rose-100 text-rose-800"; }
                    else if (st === 'excused') { statusText = "مجاز ★"; statusClass = "bg-amber-100 text-amber-800"; }
                }

                return `
                    <tr class="border-b border-slate-100 text-[11px]">
                        <td class="p-2 text-center font-bold">${i+1}</td>
                        <td class="p-2 font-bold text-slate-800">${s.name}</td>
                        <td class="p-2 text-center">${s.class} (${s.section})</td>
                        <td class="p-2 text-center"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${statusClass}">${statusText}</span></td>
                    </tr>
                `;
            }).join('') || `<tr><td colspan="4" class="p-3 text-center text-slate-400">لا يوجد سجل لهذه التصفية</td></tr>`;
        }

        function updateAttStudentDropdown() {
            const stg = document.getElementById('rep-att-st-stage').value;
            const sec = document.getElementById('rep-att-st-sec').value;
            const select = document.getElementById('rep-att-st-id');

            let filtered = appState.students.filter(s => 
                (stg === 'all' || s.class === stg) && (sec === 'all' || s.section === sec)
            );

            select.innerHTML = filtered.map(s => `<option value="${s.id}">${s.name} (${s.class} - ${s.section})</option>`).join('');
            renderSelectedStudentAttReport();
        }

        function renderSelectedStudentAttReport() {
            const stId = parseInt(document.getElementById('rep-att-st-id').value);
            const container = document.getElementById('rep-att-st-details');
            let student = appState.students.find(s => s.id === stId);

            if (!student) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">اختر طالباً لعرض تقريره المفصل</p>`;
                return;
            }

            let logRows = (student.absenceLog || []).map(l => `
                <tr class="border-b border-slate-100 text-[10px]">
                    <td class="p-1.5 text-slate-700">${l.date}</td>
                    <td class="p-1.5">${l.day}</td>
                    <td class="p-1.5 font-bold ${l.status === 'غائب' ? 'text-rose-600' : 'text-amber-600'}">${l.status}</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                    <h4 class="font-black text-xs text-slate-800 mb-1">${student.name}</h4>
                    <p class="text-[10px] text-slate-500 mb-2">${student.class} (شعبة ${student.section}) | ${student.phone}</p>
                    <div class="grid grid-cols-3 gap-1 text-center text-[10px] font-bold mb-3">
                        <div class="bg-emerald-100 text-emerald-800 p-1.5 rounded-xl">حضور: ${student.attendanceCount||0}</div>
                        <div class="bg-rose-100 text-rose-800 p-1.5 rounded-xl">غياب: ${student.absenceCount||0}</div>
                        <div class="bg-amber-100 text-amber-800 p-1.5 rounded-xl">إجازة: ${student.excusedCount||0}</div>
                    </div>
                    <h5 class="font-bold text-[11px] text-slate-700 mb-1">سجل الغيابات والإجازات التفصيلي:</h5>
                    <table class="w-full text-right bg-white rounded-xl overflow-hidden border border-slate-100">
                        <thead class="bg-slate-200 text-slate-700 text-[9px]"><tr><th class="p-1.5">التاريخ</th><th class="p-1.5">اليوم</th><th class="p-1.5">الحالة</th></tr></thead>
                        <tbody>${logRows || '<tr><td colspan="3" class="p-2 text-center text-slate-400">سجل الطالب نظيف الخالي من الغيابات</td></tr>'}</tbody>
                    </table>
                </div>
            `;
        }

        function updateAttExceededReport() {
            const stg = document.getElementById('rep-exc-stage').value;
            const sec = document.getElementById('rep-exc-sec').value;
            const tbody = document.getElementById('att-exc-report-body');

            let filtered = appState.students.filter(s => 
                (stg === 'all' || s.class === stg) && (sec === 'all' || s.section === sec) && (s.absenceCount >= 4)
            );

            tbody.innerHTML = filtered.map((s, i) => `
                <tr class="border-b border-rose-100 text-[11px] bg-rose-50/50">
                    <td class="p-2 text-center font-bold text-rose-900">${i+1}</td>
                    <td class="p-2 font-bold text-rose-950">${s.name}</td>
                    <td class="p-2 text-center text-slate-700">${s.class} (${s.section})</td>
                    <td class="p-2 text-center font-black text-rose-700">${s.absenceCount} محاضرات</td>
                    <td class="p-2 text-center font-black text-rose-900">${Math.round((s.absenceCount / 15) * 100)}%</td>
                </tr>
            `).join('') || `<tr><td colspan="5" class="p-3 text-center text-slate-400">لا يوجد طلبة متجاوزين لنسبة الغياب 10%</td></tr>`;
        }

        function updateGradesSectionReport() {
            const stg = document.getElementById('rep-grd-stage').value;
            const sec = document.getElementById('rep-grd-sec').value;
            const tbody = document.getElementById('grades-sec-report-body');

            let filtered = appState.students.filter(s => 
                (stg === 'all' || s.class === stg) && (sec === 'all' || s.section === sec)
            );

            tbody.innerHTML = filtered.map((s, i) => {
                let saai = (s.t1Exam||0) + (s.t1Eval||0) + (s.t2Exam||0) + (s.t2Eval||0);
                let final = s.final || 0;
                let total = saai + final;
                let passed = total >= 50;

                return `
                    <tr class="border-b border-slate-100 text-[10px] ${passed ? 'bg-emerald-50/30' : 'bg-rose-50/30'}">
                        <td class="p-1.5 text-center font-bold">${i+1}</td>
                        <td class="p-1.5 font-bold text-slate-800">${s.name}</td>
                        <td class="p-1.5 text-center font-black text-amber-700">${saai}</td>
                        <td class="p-1.5 text-center font-black text-purple-700">${final}</td>
                        <td class="p-1.5 text-center font-black text-slate-900 text-xs">${total}</td>
                        <td class="p-1.5 text-center"><span class="px-2 py-0.5 rounded-full text-[9px] font-black ${passed ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}">${passed ? 'ناجح' : 'راسب'}</span></td>
                    </tr>
                `;
            }).join('') || `<tr><td colspan="6" class="p-3 text-center text-slate-400">لا توجد بيانات مطابقة</td></tr>`;
        }

        // --- Application Initialization ---
        window.onload = function() {
            switchTab(1); // Default to المراحل والطلبة
        };
    </script>
</body>
</html>
